<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <fieldset>
      <legend>Options</legend>
      <div>
        <input type="checkbox" id="showNA" name="showNA" />
        <label for="showNA">Show N/A if no rating is available</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>clist.by (optional)</legend>
      <div>
        <label for="clistUser">Username</label>
        <input type="text" id="clistUser" />
      </div>
      <div>
        <label for="clistKey">API key</label>
        <input type="password" id="clistKey" />
      </div>
      <button id="clistSave">Save</button>
    </fieldset>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
